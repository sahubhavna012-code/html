<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Hyperlink  -->
     <a href="https://www.google.com/">Google</a>
     <br>
    <!-- Abbrevation -->
    <abbr title="World Health Organization">WHO</abbr>
    <br>
    <!-- Acronym -->
    <acronym title="United Nations">UN</acronym>
    <br>
    <!-- Address -->
    <address>
        123 Main Street<br>
        City, State 12345<br>
        Email: <a href="mailto:example@example.com">example@example.com</a>
    </address>
    <!-- area -->
     <img src="us-map-2200.jpg" alt="Map of the United States" usemap="#usmap" height="300px" >
     <map name="usmap">
        <area shape="rect" coords="200,200,100,100" href="https://www.google.com/maps/@43.4181353,-94.14524,3z?entry=ttu&g_ep=EgoyMDI2MDgzMS4wIKXMDSoASAFQAw%3D%3D" alt="Area 1">
    </map>
    <!-- Article -->
    <article>
        <h2>Article Title</h2>
        <p>This is the content of the article.</p>
    </article>
    <!-- Aside -->
     <aside>
        <h3>Important</h3>
        <p>Practical information goes here.</p>
     </aside>
    <!-- Audio -->
     <audio controls>
        <source src="_Munni Badnaam Hui_ [Full Song] Dabangg _ Feat. Malaika Arora Khan.mp3" type="audio/mpeg">
     </audio>
     <br>
    <!-- Bold Text -->
    <b>This text is bold.</b>
    <br>
    <!-- base -->

    <!-- Bidirectional Isolation (bdi) is used to isolate a part of text that might be formatted in a different direction from other text outside it. For example, if you have a paragraph in English and you want to include a phrase in Arabic, you can use the bdi tag to ensure that the Arabic text is displayed correctly without affecting the surrounding English text. -->

    <p>This is an example of <bdi>isolated text</bdi> in a paragraph.</p>
</body>
</html>
